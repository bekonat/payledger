syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bekonat/payledger/gen/ledger/v1;ledgerv1";

// LedgerService is the internal API for other backend services. Amounts are
// integers in minor units (tiyn for KZT, cents for USD).
service LedgerService {
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc Deposit(DepositRequest) returns (TransferResponse);
  rpc Withdraw(WithdrawRequest) returns (TransferResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
}

message Account {
  string id = 1;
  string owner_id = 2;
  string currency = 3;
  int64 balance = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateAccountRequest {
  string owner_id = 1;
  string currency = 2;
}

message GetAccountRequest {
  string id = 1;
}

message ListEntriesRequest {
  string account_id = 1;
  int64 cursor = 2;
  int32 limit = 3;
}

message Entry {
  int64 id = 1;
  string transfer_id = 2;
  string account_id = 3;
  int64 amount = 4;
  int64 balance_after = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
  int64 next_cursor = 2;
}

message DepositRequest {
  string account_id = 1;
  int64 amount = 2;
  string idempotency_key = 3;
}

message WithdrawRequest {
  string account_id = 1;
  int64 amount = 2;
  string idempotency_key = 3;
}

message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  int64 amount = 3;
  string idempotency_key = 4;
}

message Transfer {
  string id = 1;
  string kind = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount = 5;
  string currency = 6;
  google.protobuf.Timestamp created_at = 7;
}

message TransferResponse {
  Transfer transfer = 1;
  bool replayed = 2;
}
