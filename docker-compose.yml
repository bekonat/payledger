services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  ledger:
    build: .
    command: ["/usr/local/bin/ledger"]
    environment:
      DATABASE_URL: postgres://payledger:payledger@postgres:5432/payledger?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  relay:
    build: .
    command: ["/usr/local/bin/relay"]
    environment:
      DATABASE_URL: postgres://payledger:payledger@postgres:5432/payledger?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports: ["8082:8082"]
    restart: on-failure
    depends_on:
      kafka: { condition: service_healthy }
      ledger: { condition: service_started }

  notifier:
    build: .
    command: ["/usr/local/bin/notifier"]
    environment:
      DATABASE_URL: postgres://payledger:payledger@postgres:5432/payledger?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports: ["8081:8081"]
    restart: on-failure
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]
